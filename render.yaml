services:
  - type: web
    name: coding-e-learning-platform
    repo: https://github.com/victormomanyi146-spec/coding-e-learning-platform
    branch: main
    region: oregon
    autoDeployTrigger: commit
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    # Intended for the existing production service only.
    # Existing secrets and service-specific environment variables are intentionally omitted.
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TIME_ZONE
        value: "Africa/Nairobi"
      - key: UNIFIED_REACT_FRONTEND
        value: "True"
