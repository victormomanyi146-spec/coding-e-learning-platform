services:
  - type: web
    name: coding-e-learning-platform
    repo: https://github.com/victormomanyi146-spec/coding-e-learning-platform
    branch: main
    region: oregon
    autoDeployTrigger: commit
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TIME_ZONE
        value: "Africa/Nairobi"
      - key: UNIFIED_REACT_FRONTEND
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
